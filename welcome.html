<!DOCTYPE html>
<html lang="en">
  <!--
    CWS deploy check:
    Public URL must match extension welcome URL and (later) privacy §7.
    Example: https://promoseptika-sudo.github.io/transparent-png-pages/welcome.html
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome — Transparent PNG</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-welcome">
    <main>
      <h1>Thanks for choosing Transparent PNG!</h1>

      <section class="welcome-step">
        <p class="welcome-step__text">1. Please make sure to pin it for fast access:</p>
        <img
          src="images/welcome-pin-step.png"
          alt="Pin Transparent PNG in the Chrome extensions menu"
          width="1800"
          height="900"
        />
      </section>

      <section class="welcome-step">
        <p class="welcome-step__text">2. Click this icon to open the side panel:</p>
        <img
          src="images/welcome-launch-step.png"
          alt="Click the Transparent PNG icon in the Chrome toolbar"
          width="1800"
          height="900"
        />
      </section>
    </main>
  </body>
</html>
